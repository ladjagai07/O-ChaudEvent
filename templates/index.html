<!DOCTYPE html>
<html lang="fr">
<head>

    <title>Ochaud Even.ci – Crée ton invitation digitale</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Ochaud Even.ci</h1>
            <p>Crée des invitations digitales élégantes pour tous tes moments importants</p>
        </div>

        <div class="carte" id="mainCard">
            <form method="POST" action="/create" id="inviteForm">

                <div class="form-group">
                    <label>Type d'événement</label>
                    <select name="event_type" id="eventType" required>
                        <option value="">-- Choisis un type --</option>
                        <option value="romantique">❤️ Rendez-vous Romantique</option>
                        <option value="mariage">💍 Mariage</option>
                        <option value="anniversaire">🎂 Anniversaire</option>
                        <option value="bapteme">🕊️ Baptême</option>
                        <option value="autre">🎉 Autre événement</option>
                    </select>
                </div>

                <!-- Zone des champs dynamiques -->
                <div id="dynamicFields"></div>

                <button type="submit" class="btn" id="submitBtn" disabled>
                    Générer mon invitation
                </button>
            </form>

            <p class="info-freemium">
                Version gratuite : 2 invitations / mois • 
                <a href="/pro">Passer en Pro →</a>
            </p>
        </div>
    </div>
