<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ochaud Even.ci</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page">
        <div class="header">
            <div class="logo">Ochaud Even.ci</div>
            <p class="tagline">Invitations d’exception</p>
        </div>

        <div class="card" id="mainCard">
            <div class="gold-line"></div>
            
            <form method="POST" action="/create" id="inviteForm">
                <div class="form-group">
                    <label>Type d’événement</label>
                    <select name="event_type" id="eventType" required>
                        <option value="">— Sélectionnez —</option>
                        <option value="romantique">Rendez-vous Romantique</option>
                        <option value="mariage">Mariage</option>
                        <option value="anniversaire">Anniversaire</option>
                        <option value="bapteme">Baptême</option>
                        <option value="autre">Autre événement</option>
                    </select>
                </div>

                <div id="dynamicFields"></div>

                <button type="submit" class="btn" id="submitBtn" disabled>
                    Créer l’invitation
                </button>
            </form>

            <div class="footer-note">
                Version gratuite · 2 invitations / mois
                <a href="/pro">Passer en Pro</a>
            </div>
        </div>
    </div>

    <script>
        const configs = {
            romantique: {
                accent: "#c9a227",
                fields: [
                    {name:"destinataire", label:"Prénom de la personne", placeholder:"Ex : Aya", required:true},
                    {name:"titre", label:"Titre de l’invitation", placeholder:"Ex : Un moment rien que pour nous", required:true},
                    {name:"date", label:"Date", type:"date", required:true},
                    {name:"heure", label:"Heure", type:"time", required:true},
                    {name:"lieu", label:"Lieu", placeholder:"Ex : Restaurant Le Petit Jardin", required:true},
                    {name:"details", label:"Activités prévues", type:"textarea", placeholder:"Ex : Dîner puis balade..."},
                    {name:"message", label:"Petit mot doux", type:"textarea", placeholder:"Ex : J’ai hâte de te voir..."},
                    {name:"photo_url", label:"Lien photo (optionnel)", type:"url"},
                    {name:"musique_url", label:"Lien musique (optionnel)", type:"url"}
                ]
            },
            mariage: {
                accent: "#d4af37",
                fields: [
                    {name:"destinataire", label:"Noms des mariés", placeholder:"Ex : Aya & Kouassi", required:true},
                    {name:"titre", label:"Titre", placeholder:"Ex : Nous nous marions", required:true},
                    {name:"date", label:"Date du mariage", type:"date", required:true},
                    {name:"heure", label:"Heure", type:"time", required:true},
                    {name:"lieu", label:"Lieu de la cérémonie", placeholder:"Ex : Église / Mairie", required:true},
                    {name:"details", label:"Programme", type:"textarea"},
                    {name:"message", label:"Message aux invités", type:"textarea"},
                    {name:"photo_url", label:"Photo (optionnel)", type:"url"}
                ]
            },
            anniversaire: {
                accent: "#c9a227",
                fields: [
                    {name:"destinataire", label:"Prénom de la personne", placeholder:"Ex : Junior", required:true},
                    {name:"titre", label:"Titre", placeholder:"Ex : Joyeux Anniversaire", required:true},
                    {name:"date", label:"Date", type:"date", required:true},
                    {name:"heure", label:"Heure", type:"time", required:true},
                    {name:"lieu", label:"Lieu", placeholder:"Ex : Résidence / Salle", required:true},
                    {name:"details", label:"Thème / Ambiance", type:"textarea"},
                    {name:"message", label:"Message", type:"textarea"},
                    {name:"photo_url", label:"Photo (optionnel)", type:"url"}
                ]
            },
            bapteme: {
                accent: "#b8860b",
                fields: [
                    {name:"destinataire", label:"Prénom de l’enfant", placeholder:"Ex : Ethan", required:true},
                    {name:"titre", label:"Titre", placeholder:"Ex : Baptême de Ethan", required:true},
                    {name:"date", label:"Date", type:"date", required:true},
                    {name:"heure", label:"Heure", type:"time", required:true},
                    {name:"lieu", label:"Lieu", placeholder:"Ex : Paroisse...", required:true},
                    {name:"details", label:"Informations", type:"textarea"},
                    {name:"message", label:"Message", type:"textarea"},
                    {name:"photo_url", label:"Photo (optionnel)", type:"url"}
                ]
            },
            autre: {
                accent: "#c9a227",
                fields: [
                    {name:"destinataire", label:"Destinataire", placeholder:"Ex : Chers amis", required:true},
                    {name:"titre", label:"Titre de l’événement", placeholder:"Ex : Soirée / Réunion", required:true},
                    {name:"date", label:"Date", type:"date", required:true},
                    {name:"heure", label:"Heure", type:"time"},
                    {name:"lieu", label:"Lieu", placeholder:"Adresse", required:true},
                    {name:"details", label:"Détails", type:"textarea"},
                    {name:"message", label:"Message", type:"textarea"},
                    {name:"photo_url", label:"Image (optionnel)", type:"url"}
                ]
            }
        };

        function updateForm() {
            const type = document.getElementById("eventType").value;
            const container = document.getElementById("dynamicFields");
            const btn = document.getElementById("submitBtn");

            container.innerHTML = "";

            if (!type || !configs[type]) {
                btn.disabled = true;
                return;
            }

            const config = configs[type];

            config.fields.forEach(field => {
                const div = document.createElement("div");
                div.className = "form-group";

                const label = document.createElement("label");
                label.textContent = field.label;
                div.appendChild(label);

                let input;
                if (field.type === "textarea") {
                    input = document.createElement("textarea");
                    input.rows = 3;
                } else {
                    input = document.createElement("input");
                    input.type = field.type || "text";
                }

                input.name = field.name;
                input.placeholder = field.placeholder || "";
                if (field.required) input.required = true;

                div.appendChild(input);
                container.appendChild(div);
            });

            const themeDiv = document.createElement("div");
            themeDiv.className = "form-group";
            themeDiv.innerHTML = `
                <label>Style de l’invitation</label>
                <select name="theme">
                    <option value="royal">Royal</option>
                    <option value="elegant">Élégant</option>
                    <option value="classique">Classique</option>
                    <option value="moderne">Moderne</option>
                </select>
            `;
            container.appendChild(themeDiv);

            btn.disabled = false;
        }

        document.getElementById("eventType").addEventListener("change", updateForm);
    </script>
</body>
</html>
