<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ochaud Even.ci</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body id="pageBody">
    <div class="container">
        <div class="header">
            <h1>Ochaud Even.ci</h1>
            <p>Crée des invitations digitales élégantes pour tous tes moments importants</p>
        </div>

        <div class="carte" id="mainCard">
            <form method="POST" action="/create" id="inviteForm">

                <div class="form-group">
                    <label>Type d'événement</label>
                    <select name="event_type" id="eventType" required>
                        <option value="">-- Choisis un type --</option>
                        <option value="romantique">❤️ Rendez-vous Romantique</option>
                        <option value="mariage">💍 Mariage</option>
                        <option value="anniversaire">🎂 Anniversaire</option>
                        <option value="bapteme">🕊️ Baptême</option>
                        <option value="autre">🎉 Autre événement</option>
                    </select>
                </div>

                <div id="dynamicFields"></div>

                <button type="submit" class="btn" id="submitBtn" disabled>
                    Générer mon invitation
                </button>
            </form>

            <p class="info-freemium">
                Version gratuite : 2 invitations / mois • 
                <a href="/pro">Passer en Pro →</a>
            </p>
        </div>
    </div>

    <script>
        const fieldsConfig = {
            romantique: {
                color: "#d90429",
                bg: "linear-gradient(135deg, #fff0f3, #ffe0e6)",
                fields: [
                    {name: "destinataire", label: "Prénom de la personne", placeholder: "Ex : Aya", required: true},
                    {name: "titre", label: "Titre de l'invitation", placeholder: "Ex : Un moment rien que pour nous", required: true},
                    {name: "date", label: "Date du rendez-vous", type: "date", required: true},
                    {name: "heure", label: "Heure", type: "time", required: true},
                    {name: "lieu", label: "Lieu", placeholder: "Ex : Restaurant Le Petit Jardin", required: true},
                    {name: "details", label: "Activités prévues", type: "textarea", placeholder: "Ex : Dîner puis balade..."},
                    {name: "message", label: "Petit mot doux", type: "textarea", placeholder: "Ex : J'ai hâte de te voir..."},
                    {name: "photo_url", label: "Lien photo (optionnel)", type: "url"},
                    {name: "musique_url", label: "Lien musique (optionnel)", type: "url"}
                ]
            },
            mariage: {
                color: "#b8860b",
                bg: "linear-gradient(135deg, #fffdf0, #fff8e1)",
                fields: [
                    {name: "destinataire", label: "Nom des mariés", placeholder: "Ex : Aya & Kouassi", required: true},
                    {name: "titre", label: "Titre", placeholder: "Ex : Nous nous marions !", required: true},
                    {name: "date", label: "Date du mariage", type: "date", required: true},
                    {name: "heure", label: "Heure de la cérémonie", type: "time", required: true},
                    {name: "lieu", label: "Lieu de la cérémonie", placeholder: "Ex : Église / Mairie", required: true},
                    {name: "details", label: "Programme", type: "textarea", placeholder: "Ex : 15h Cérémonie - 18h Réception"},
                    {name: "message", label: "Message aux invités", type: "textarea"},
                    {name: "photo_url", label: "Photo des mariés (optionnel)", type: "url"}
                ]
            },
            anniversaire: {
                color: "#e91e63",
                bg: "linear-gradient(135deg, #fff0f7, #fce4ec)",
                fields: [
                    {name: "destinataire", label: "Prénom de la personne fêtée", placeholder: "Ex : Junior", required: true},
                    {name: "titre", label: "Titre", placeholder: "Ex : Joyeux Anniversaire !", required: true},
                    {name: "date", label: "Date de la fête", type: "date", required: true},
                    {name: "heure", label: "Heure", type: "time", required: true},
                    {name: "lieu", label: "Lieu de la fête", placeholder: "Ex : Résidence / Salle", required: true},
                    {name: "details", label: "Thème / Ambiance", type: "textarea"},
                    {name: "message", label: "Message d'invitation", type: "textarea"},
                    {name: "photo_url", label: "Photo (optionnel)", type: "url"}
                ]
            },
            bapteme: {
                color: "#1565c0",
                bg: "linear-gradient(135deg, #e3f2fd, #bbdefb)",
                fields: [
                    {name: "destinataire", label: "Prénom de l'enfant", placeholder: "Ex : Ethan", required: true},
                    {name: "titre", label: "Titre", placeholder: "Ex : Baptême de Ethan", required: true},
                    {name: "date", label: "Date du baptême", type: "date", required: true},
                    {name: "heure", label: "Heure", type: "time", required: true},
                    {name: "lieu", label: "Lieu", placeholder: "Ex : Paroisse Saint...", required: true},
                    {name: "details", label: "Informations", type: "textarea"},
                    {name: "message", label: "Message aux invités", type: "textarea"},
                    {name: "photo_url", label: "Photo (optionnel)", type: "url"}
                ]
            },
            autre: {
                color: "#2e7d32",
                bg: "linear-gradient(135deg, #e8f5e9, #c8e6c9)",
                fields: [
                    {name: "destinataire", label: "Destinataire", placeholder: "Ex : Chers amis", required: true},
                    {name: "titre", label: "Titre de l'événement", placeholder: "Ex : Soirée / Réunion", required: true},
                    {name: "date", label: "Date", type: "date", required: true},
                    {name: "heure", label: "Heure", type: "time"},
                    {name: "lieu", label: "Lieu", placeholder: "Adresse", required: true},
                    {name: "details", label: "Détails", type: "textarea"},
                    {name: "message", label: "Message", type: "textarea"},
                    {name: "photo_url", label: "Image (optionnel)", type: "url"}
                ]
            }
        };

        function updateForm() {
            const select = document.getElementById("eventType");
            const type = select.value;
            const container = document.getElementById("dynamicFields");
            const card = document.getElementById("mainCard");
            const btn = document.getElementById("submitBtn");
            const body = document.getElementById("pageBody");

            container.innerHTML = "";

            if (!type) {
                btn.disabled = true;
                body.style.background = "linear-gradient(135deg, #f8f9fa, #e9ecef)";
                card.style.borderTopColor = "#e0e0e0";
                return;
            }

            const config = fieldsConfig[type];
            if (!config) return;

            // Animation de changement de fond
            body.style.transition = "background 0.6s ease";
            body.style.background = config.bg;

            // Couleur de la carte
            card.style.borderTopColor = config.color;
            card.style.transition = "border-color 0.4s ease, transform 0.3s ease";
            card.style.transform = "scale(1.01)";
            setTimeout(() => card.style.transform = "scale(1)", 300);

            // Créer les champs avec animation
            config.fields.forEach((field, index) => {
                const div = document.createElement("div");
                div.className = "form-group";
                div.style.opacity = "0";
                div.style.transform = "translateY(15px)";
                div.style.transition = `all 0.4s ease ${index * 0.07}s`;

                const label = document.createElement("label");
                label.innerText = field.label;
                div.appendChild(label);

                let input;
                if (field.type === "textarea") {
                    input = document.createElement("textarea");
                    input.rows = 3;
                } else {
                    input = document.createElement("input");
                    input.type = field.type || "text";
                }

                input.name = field.name;
                input.placeholder = field.placeholder || "";
                if (field.required) input.required = true;

                div.appendChild(input);
                container.appendChild(div);

                // Déclencher l'animation
                setTimeout(() => {
                    div.style.opacity = "1";
                    div.style.transform = "translateY(0)";
                }, 50);
            });

            // Champ thème
            const themeDiv = document.createElement("div");
            themeDiv.className = "form-group";
            themeDiv.innerHTML = `
                <label>Style de l'invitation</label>
                <select name="theme">
                    <option value="classique">Classique</option>
                    <option value="elegant">Élégant</option>
                    <option value="moderne">Moderne</option>
                    <option value="doux">Doux</option>
                </select>
            `;
            container.appendChild(themeDiv);

            btn.disabled = false;
            btn.style.background = config.color;
        }

        document.getElementById("eventType").onchange = updateForm;
    </script>
</body>
</html>
