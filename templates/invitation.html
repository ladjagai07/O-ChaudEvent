<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ inv.titre }} – Ochaud Even.ci</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* Styles spécifiques à la page invitation */
        body.invitation-page {
            background: #f5f5f5;
            padding: 20px 12px;
        }

        .invite-card {
            max-width: 480px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.12);
            position: relative;
        }

        .invite-header {
            padding: 35px 25px 25px;
            text-align: center;
            color: white;
            position: relative;
        }

        .invite-header::after {
            content: "";
            position: absolute;
            bottom: -20px;
            left: 0;
            right: 0;
            height: 40px;
            background: white;
            border-radius: 50% 50% 0 0;
        }

        .event-badge {
            display: inline-block;
            background: rgba(255,255,255,0.25);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            backdrop-filter: blur(4px);
        }

        .invite-header h1 {
            font-size: 1.8rem;
            margin: 10px 0;
            line-height: 1.3;
            color: white;
        }

        .destinataire {
            font-size: 1.25rem;
            opacity: 0.95;
            margin-top: 8px;
        }

        .invite-body {
            padding: 30px 25px 25px;
            text-align: center;
        }

        .photo-container {
            margin: -10px auto 25px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid white;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info-block {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 18px;
            text-align: left;
        }

        .info-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        .info-icon {
            font-size: 1.3rem;
            min-width: 28px;
        }

        .info-text strong {
            display: block;
            font-size: 0.85rem;
            color: #777;
            margin-bottom: 2px;
        }

        .message-box {
            background: #fff8f0;
            border-left: 4px solid var(--event-color);
            padding: 16px 18px;
            border-radius: 0 12px 12px 0;
            margin: 20px 0;
            font-style: italic;
            text-align: left;
            line-height: 1.5;
        }

        .details-box {
            background: #f0f7ff;
            padding: 16px;
            border-radius: 12px;
            margin: 15px 0;
            text-align: left;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .musique-player {
            margin: 20px 0;
        }

        .musique-player audio {
            width: 100%;
            border-radius: 30px;
        }

        .footer-invite {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 0.8rem;
            color: #999;
        }

        .views {
            margin-top: 8px;
            font-size: 0.85rem;
            color: #aaa;
        }

        /* ===== COULEURS PAR TYPE D'ÉVÉNEMENT ===== */
        .type-romantique .invite-header { background: linear-gradient(135deg, #d90429, #ff4d6d); }
        .type-romantique { --event-color: #d90429; }

        .type-mariage .invite-header { background: linear-gradient(135deg, #b8860b, #daa520); }
        .type-mariage { --event-color: #b8860b; }
